<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <link rel="stylesheet" href="style.css" />
        <script defer src="script.js"></script>
        <title>Document</title>
    </head>

    <body class="bg-secondary">
        <header class="container-fluid text-center">
            <div class="row bg-dark p-3">
                <p class="col-auto ms-auto mb-0 fs-1 fw-bold text-light align-self-center">MasterMind</p>
                <img class="col-1 me-auto p-0" src="img/ceveau.png" alt="" />
            </div>
        </header>

        <main class="container-fluid bg-secondary">
            <div id="jeu" class="row text-center text-light">
                <h3 class="col-12 pt-4 mb-0">L'ordinateur à choisi une combinaison</h3>
                <p class="col-12 fs-5 fw-light">essayez de la retrouver !</p>

                <div
                    id="carre1"
                    class="col-sm-2 col-m-2 p-0 m-3 bg-light position-relative border border-dark border-4 rounded carre"
                ></div>
                <div
                    id="carre2"
                    class="col-sm-2 col-m-2 p-0 m-3 bg-light position-relative border border-dark border-4 rounded carre"
                ></div>
                <div
                    id="carre3"
                    class="col-sm-2 col-m-2 p-0 m-3 bg-light position-relative border border-dark border-4 rounded carre"
                ></div>
                <div
                    id="carre4"
                    class="col-sm-2 col-m-2 p-0 m-3 bg-light position-relative border border-dark border-4 rounded carre"
                ></div>
                <div
                    id="resultat"
                    class="col-sm-2 col-m-2 p-0 m-3 bg-dark position-relative border border-light border-4 rounded d-flex flex-wrap"
                >
                    <img class="col-6 p-2" src="img/pions/black.png" alt="" />
                    <img class="col-6 p-2" src="img/pions/black.png" alt="" />
                    <img class="col-6 p-2" src="img/pions/black.png" alt="" />
                    <img class="col-6 p-2" src="img/pions/black.png" alt="" />
                </div>
            </div>
            <div class="row d-flex justify-content-center">
                <img id="pionRouge" class="col-1" src="img/pions/pionRouge.png" alt="" />
                <img id="pionBleu" class="col-1" src="img/pions/pionBleu.png" alt="" />
                <img id="pionVert" class="col-1" src="img/pions/pionVert.png" alt="" />
                <img id="pionJaune" class="col-1" src="img/pions/pionJaune.png" alt="" />
            </div>
            <div class="row d-flex justify-content-center pt-4">
                <div class="col-2 d-flex align-items-center">
                    <button id="boutonValider" class="btn btn-success btn-lg w-100 border border-lg border-dark">
                        Valider
                    </button>
                </div>
                <div class="col-2 d-flex align-items-center">
                    <button id="boutonAnnuler" class="btn btn-danger btn-lg w-100 border border-dark">Annuler</button>
                </div>
            </div>
        </main>
    </body>
</html>
